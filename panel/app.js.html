<script>
const D = __DATOS__;

/* ── Fechas y targets ─────────────────────────────────────────────── */
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_C = ['dom','lun','mar','mié','jue','vie','sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
               'septiembre','octubre','noviembre','diciembre'];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const desdeIso = s => { const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); };
const luDom = d => (d.getDay() + 6) % 7;            // 0 = lunes
const esEntreno = d => [0,1,3,4].includes(luDom(d));
const diaDelAno = d => Math.floor((d - new Date(d.getFullYear(),0,0)) / 864e5);

/* Mifflin-St Jeor, igual que nutricion.py: si divergen, los números mienten. */
function targets(pesoKg, entreno){
  const p = D.perfil, kg = pesoKg || p.peso_kg;
  const bmr = 10*kg + 6.25*p.altura_cm - 5*p.edad + (p.sexo === 'h' ? 5 : -161);
  const tdee = bmr * 1.45;
  const obj = Math.max(tdee * 0.72, bmr * 0.95, 1400);
  const prot = Math.round(1.9*kg), gras = Math.round(0.6*kg);
  const carbProm = Math.max(0, Math.round((obj - prot*4 - gras*9)/4));
  const bump = 140, drop = bump*4/3;
  return entreno
    ? {kcal: Math.round(obj+bump), p: prot, c: Math.max(0,Math.round(carbProm+bump/4)), f: gras, fib: 35, bmr: Math.round(bmr), tdee: Math.round(tdee)}
    : {kcal: Math.round(obj-drop), p: prot, c: Math.max(0,Math.round(carbProm-drop/4)), f: gras, fib: 35, bmr: Math.round(bmr), tdee: Math.round(tdee)};
}

function planDe(d){
  const clave = esEntreno(d) ? 'entreno' : 'descanso';
  const lista = D.planes[clave];
  return lista[diaDelAno(d) % lista.length];
}
const sesionDe = d => D.diaSesion[String(luDom(d))];

/* Hábitos: el de alcohol está aquí por el ALT de 68, no de relleno. */
const HABITOS = [
  {id:'creatina', t:'Creatina — 5 g',            s:'Cualquier hora. Tu creatinina salió en 56 y eres vegetariano.'},
  {id:'pasos',    t:'9.000 pasos',               s:'El déficit lo pone la comida; esto es para tu corazón.'},
  {id:'caminata', t:'12 min después del almuerzo', s:'Aplana el pico de glucosa. Corto y gratis.'},
  {id:'sinalcohol', t:'Sin alcohol',             s:'Cero hasta que repitas las pruebas hepáticas.'},
  {id:'agua',     t:'2,5 L de agua',             s:'Con 35 g de fibra al día, sin agua te vas a sentir pesado.'},
];

/* ── Estado ───────────────────────────────────────────────────────── */
let DB = null, SAMPLE = null, PUEDE_IMG = false;
let HOY = iso(new Date());     // el día real
let VIENDO = HOY;              // el día en pantalla
let ANCLA = HOY;               // cualquier día de la semana mostrada
const masDias = (f, n) => iso(new Date(desdeIso(f).getTime() + n*864e5));
const esFuturo = f => f > HOY;
const lunesDe = f => { const d = desdeIso(f); return masDias(f, -luDom(d)); };
let dia = {};                 // documento de hoy
let semana = {};              // iso -> documento
const abiertos = new Set();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function totales(dd){
  const t = {kcal:0,p:0,c:0,f:0,fib:0};
  const plan = planDe(desdeIso(dd.fecha || VIENDO));
  const ticks = dd.ticks || {};
  for (const rid of [...plan.comidas, ...plan.snacks]) {
    if (!ticks['r_'+rid]) continue;
    const r = D.recetas[rid]; if (!r) continue;
    t.kcal += r.kcal; t.p += r.p; t.c += r.c; t.f += r.f; t.fib += r.fib;
  }
  for (const e of (dd.extras || [])) {
    t.kcal += +e.kcal||0; t.p += +e.p||0; t.c += +e.c||0; t.f += +e.f||0; t.fib += +e.fib||0;
  }
  return t;
}

const pesoVigente = () => {
  const fechas = Object.keys(semana).filter(f => semana[f]?.peso).sort();
  return fechas.length ? +semana[fechas[fechas.length-1]].peso : D.perfil.peso_kg;
};

/* ── Persistencia ─────────────────────────────────────────────────── */
let cola = Promise.resolve();
function guardar(campos){
  if (esFuturo(VIENDO)) return;      // un día que no ha pasado no se registra
  Object.assign(dia, campos);
  dia.fecha = VIENDO;
  semana[VIENDO] = dia;
  const destino = VIENDO;            // se fija ahora: la cola es asíncrona
  render();
  if (!DB) return;
  // Serializa las escrituras: el store es last-writer-wins y dos ticks
  // rápidos en paralelo pueden hacer que el segundo pise al primero.
  cola = cola.then(() => DB.doc('dias/' + destino).set(JSON.parse(JSON.stringify(dia))))
             .then(() => { $('savedTag').textContent = 'guardado'; })
             .catch(e => {
               $('savedTag').textContent = '';
               mostrarOffline(e.code === 'revoked'
                 ? 'Se perdió el permiso de guardar. Lo que veas sigue en pantalla pero no se está guardando.'
                 : 'No pude guardar el último cambio (' + (e.code || 'error') + '). Sigue anotando: se reintenta al próximo cambio.');
             });
}
function mostrarOffline(msg){ const o = $('offline'); o.textContent = msg; o.hidden = !msg; }

function toggle(id){
  if (esFuturo(VIENDO)) return;
  const t = {...(dia.ticks || {})};
  t[id] ? delete t[id] : t[id] = true;
  guardar({ticks: t});
}

/* ── Render: cabecera ─────────────────────────────────────────────── */
function renderHead(){
  const d = desdeIso(VIENDO), ent = esEntreno(d);
  $('hTitle').textContent = `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
  const b = $('hType');
  b.textContent = ent ? 'día de entreno' : 'día de descanso';
  b.className = 'badge ' + (ent ? 'b-train' : 'b-rest');

  const pesos = Object.keys(semana).filter(f => semana[f]?.peso).sort()
                      .map(f => ({f, v:+semana[f].peso}));
  if (pesos.length){
    const ult = pesos[pesos.length-1];
    $('hWeight').textContent = ult.v.toFixed(1) + ' kg';
    const rec = pesos.slice(-7), prev = pesos.slice(-14,-7);
    if (prev.length){
      const m1 = rec.reduce((a,x)=>a+x.v,0)/rec.length;
      const m0 = prev.reduce((a,x)=>a+x.v,0)/prev.length;
      const dl = m1 - m0;
      const el = $('hTrend');
      el.textContent = (dl>0?'+':'') + dl.toFixed(2) + ' kg / semana';
      el.className = 'd ' + (dl < 0 ? 'dn' : dl > 0 ? 'up' : '');
    } else {
      $('hTrend').textContent = `faltan ${(ult.v - D.perfil.peso_meta_kg).toFixed(1)} kg`;
      $('hTrend').className = 'd';
    }
  } else {
    $('hWeight').textContent = D.perfil.peso_kg.toFixed(1) + ' kg';
    $('hTrend').textContent = 'registra tu peso';
  }

  // Racha: días consecutivos hacia atrás con algo anotado. Siempre desde HOY,
  // no desde el día que se esté mirando: es una propiedad del presente.
  let racha = 0;
  for (let i = 0; i < 60; i++){
    const f = iso(new Date(Date.now() - i*864e5));
    const dd = semana[f];
    const algo = dd && (dd.peso || Object.keys(dd.ticks||{}).length || (dd.extras||[]).length || dd.whoop);
    if (algo) racha++; else if (i > 0) break;
  }
  $('hStreak').textContent = racha;
}

/* ── Render: macros ───────────────────────────────────────────────── */
function renderMacros(){
  const t = targets(pesoVigente(), esEntreno(desdeIso(VIENDO)));
  const tot = totales(dia);
  const filas = [
    ['kcal', tot.kcal, t.kcal, ''], ['prot', tot.p, t.p, 'g'],
    ['carb', tot.c, t.c, 'g'], ['gras', tot.f, t.f, 'g'], ['fibra', tot.fib, t.fib, 'g'],
  ];
  $('macros').innerHTML = filas.map(([nm,a,m,u]) => {
    const pct = m ? a/m : 0;
    const cls = pct > 1.08 ? 'over' : pct >= 0.92 ? 'good' : '';
    return `<div class="mrow"><span class="nm">${nm}</span>
      <div class="track"><div class="fill ${cls}" style="width:${Math.min(100, pct*100).toFixed(1)}%"></div></div>
      <span class="vv"><b>${Math.round(a)}</b>/${m}${u}</span></div>`;
  }).join('');
  $('macroTag').textContent = `meta ${t.kcal} kcal · tdee ${t.tdee}`;
}

/* ── Render: comidas ──────────────────────────────────────────────── */
function fila({id, titulo, sub, acciones = '', detalle = ''}){
  const on = !!(dia.ticks || {})[id];
  const bloq = esFuturo(VIENDO) ? ' disabled' : '';
  return `<div class="item ${on?'done':''}">
    <button class="tick" data-tick="${id}" aria-pressed="${on}"${bloq} aria-label="Marcar ${esc(titulo)}">
      <svg viewBox="0 0 16 16" aria-hidden="true"><polyline points="2.5,8.5 6,12 13.5,4"/></svg></button>
    <div class="itxt"><div class="t">${esc(titulo)}</div><div class="s">${sub}</div></div>
    <div class="iact">${acciones}</div>
    ${detalle}
  </div>`;
}

function renderComidas(){
  const plan = planDe(desdeIso(VIENDO));
  const etiquetas = {b:'Desayuno', l:'Almuerzo', d:'Cena'};
  const filas = [];
  for (const rid of plan.comidas.concat(plan.snacks)){
    const r = D.recetas[rid]; if (!r) continue;
    const et = etiquetas[rid[0]] || 'Snack';
    const abierto = abiertos.has(rid);
    let det = '';
    if (abierto){
      det = `<div class="detail">
        <h4>Ingredientes</h4><div class="ing">${r.ing.map(([n,g]) => `<span>${esc(n)} — ${g} g</span>`).join('')}</div>
        ${r.esp.length ? `<h4>Especias</h4><div class="ing"><span>${esc(r.esp.join(', '))}</span></div>` : ''}
        <h4>Pasos</h4><ol>${r.pasos.map(p => `<li>${esc(p)}</li>`).join('')}</ol></div>`;
    }
    filas.push(fila({
      id: 'r_'+rid, titulo: `${et} · ${r.n}`,
      sub: `${r.kcal} kcal · ${r.p} P / ${r.c} C / ${r.f} G · ${r.min} min`,
      acciones: `<button class="mini" data-receta="${rid}">${abierto?'Cerrar':'Receta'}</button>`,
      detalle: det,
    }));
  }
  $('meals').innerHTML = filas.join('');
  const total = plan.comidas.length + plan.snacks.length;
  const hechas = Object.keys(dia.ticks || {}).filter(k => k.startsWith('r_')).length;
  $('mealTag').textContent = `${hechas}/${total}`;
}

/* ── Render: entreno ──────────────────────────────────────────────── */
function renderGym(){
  const d = desdeIso(VIENDO), clave = sesionDe(d);
  if (clave === 'descanso'){
    $('gym').innerHTML = `<div class="item"><div></div><div class="itxt">
      <div class="t">Descanso total</div>
      <div class="s" style="font-family:var(--f-ui);font-size:12.5px">No es pereza: en déficit recuperas peor, y el músculo se construye descansando.</div>
      </div><div></div></div>`;
    $('gymTag').textContent = 'domingo';
    return;
  }
  if (clave === 'cardio'){
    const c = D.cardio;
    const ses = c.sesiones.filter(s => !/almuerzo/i.test(s.cuando));
    $('gym').innerHTML = ses.map((s,i) => fila({
      id: 'cardio_'+i, titulo: `${s.tipo} — ${s.duracion_min} min`, sub: esc(s.intensidad),
    })).join('');
    $('gymTag').textContent = 'descanso activo';
    return;
  }
  const s = D.entrenos[clave];
  const abierto = abiertos.has('gym');
  const det = abierto ? `<div class="detail">
      <h4>Calentamiento</h4><div style="font-size:13.5px">${esc(s.cal)}</div>
      <h4>Sesión</h4><div class="exlist">${s.ej.map((e,i) => `<div class="ex">
        <span class="es">${i+1}</span>
        <span class="en">${esc(e.n)}</span>
        <span class="es">${e.s} × ${esc(e.r)} · RIR ${e.rir} · ${e.d}s</span>
        ${e.nota ? `<div class="enote">${esc(e.nota)}</div>` : ''}
        <div class="enote" style="color:var(--ink-faint)">↳ ${esc(e.alt.join(', '))}</div>
      </div>`).join('')}</div>
      <h4>Seguridad</h4><div style="font-size:13.5px">Pines del rack puestos antes de la primera serie. Sin observador, nunca al fallo en press de banca.</div>
    </div>` : '';
  const series = s.ej.reduce((a,e) => a+e.s, 0);
  $('gym').innerHTML = fila({
    id: 'gym', titulo: s.n,
    sub: `${s.ej.length} ejercicios · ${series} series · ${s.min} min`,
    acciones: `<button class="mini" data-gym="1">${abierto?'Cerrar':'Ver sesión'}</button>`,
    detalle: det,
  });
  $('gymTag').textContent = (dia.ticks||{}).gym ? 'hecho' : `${series} series`;
}

function renderHabitos(){
  $('habits').innerHTML = HABITOS.map(h => fila({
    id: 'h_'+h.id, titulo: h.t,
    sub: `<span style="font-family:var(--f-ui);font-size:12.5px">${esc(h.s)}</span>`,
  })).join('');
  const n = HABITOS.filter(h => (dia.ticks||{})['h_'+h.id]).length;
  $('habitTag').textContent = `${n}/${HABITOS.length}`;
}

/* ── Render: WHOOP ────────────────────────────────────────────────── */
function renderWhoop(){
  const w = dia.whoop;
  if (!w){ $('whoopChips').innerHTML = ''; $('whoopAdvice').innerHTML = ''; return; }
  const cls = w.recovery == null ? '' : w.recovery < 34 ? 'rec-r' : w.recovery < 67 ? 'rec-y' : 'rec-g';
  const chips = [];
  if (w.recovery != null) chips.push(`<span class="chip ${cls}">recovery <b>${Math.round(w.recovery)}%</b></span>`);
  if (w.sueno != null) chips.push(`<span class="chip">sueño <b>${(+w.sueno).toFixed(1)} h</b></span>`);
  if (w.strain != null) chips.push(`<span class="chip">strain <b>${(+w.strain).toFixed(1)}</b></span>`);
  $('whoopChips').innerHTML = chips.join('');

  const ent = esEntreno(desdeIso(VIENDO)), av = [];
  if (w.recovery != null){
    if (w.recovery < 34) av.push(['v-bad', ent
      ? 'Recovery rojo. Haz la sesión pero baja una serie de cada compuesto y quédate en RIR 3. Hoy no es día de records.'
      : 'Recovery rojo en día de descanso. Camina y ya, no agregues nada.']);
    else if (w.recovery < 67) av.push(['v-warn',
      'Recovery amarillo. Entrena normal sin forzar el fallo. Si el primer compuesto pesa de más, quédate en el peso de la semana pasada.']);
    else av.push(['v-ok', ent
      ? 'Recovery verde. Este es el día para intentar sumar la repetición o el disco.'
      : 'Recovery verde en descanso. Camina largo y aprovecha para cocinar en tanda.']);
  }
  if (w.sueno != null && w.sueno < 6.5) av.push(['v-warn',
    `Solo ${(+w.sueno).toFixed(1)} h. Dormir poco sube la grelina y baja la leptina: el hambre de hoy es bioquímica, no falta de voluntad. Sostente en la proteína y en las palomitas de volumen.`]);
  if (w.strain != null && w.strain > 15) av.push(['v-warn',
    `Strain ${(+w.strain).toFixed(1)}, día muy cargado. Si te sientes vacío suma 150 kcal de carbos: un día así no rompe el déficit semanal.`]);
  $('whoopAdvice').innerHTML = av.map(([c,t]) =>
    `<div class="extra" style="border-left-color:var(--${c==='v-ok'?'ok':c==='v-bad'?'high':'low'});background:transparent">
      <span class="verdict ${c}">${c==='v-ok'?'verde':c==='v-bad'?'atención':'ojo'}</span>
      <div class="ev">${esc(t)}</div></div>`).join('');
}

/* ── Render: extras fuera del plan ────────────────────────────────── */
function renderExtras(){
  const ex = dia.extras || [];
  if (!ex.length){ $('extraList').innerHTML = ''; return; }
  $('extraList').innerHTML = ex.map((e,i) => `<div class="extra">
    <div class="eh"><span class="en2">${esc(e.desc)}</span>
      <button class="mini" data-delextra="${i}">Quitar</button></div>
    <div class="em">${Math.round(e.kcal)} kcal · ${Math.round(e.p)} P / ${Math.round(e.c)} C / ${Math.round(e.f)} G</div>
    ${e.aviso ? `<div class="ev">${esc(e.aviso)}</div>` : ''}
  </div>`).join('');
}

/* ── Render: semana ───────────────────────────────────────────────── */
function renderSemana(){
  const lunes = lunesDe(ANCLA);
  const fechas = Array.from({length: 7}, (_, i) => masDias(lunes, i));
  const dias = fechas.map(desdeIso);

  const d0 = desdeIso(fechas[0]), d6 = desdeIso(fechas[6]);
  const mismoMes = d0.getMonth() === d6.getMonth();
  $('weekTitle').textContent = mismoMes
    ? `${d0.getDate()}–${d6.getDate()} de ${MESES[d0.getMonth()]}`
    : `${d0.getDate()} ${MESES[d0.getMonth()].slice(0,3)} – ${d6.getDate()} ${MESES[d6.getMonth()].slice(0,3)}`;
  $('wkNow').setAttribute('aria-current', String(lunes === lunesDe(HOY)));

  $('week').innerHTML = dias.map(d => {
    const f = iso(d), dd = semana[f] || {}, esHoy = f === HOY;
    const futuro = esFuturo(f);
    const plan = planDe(d), ent = esEntreno(d);
    const totalTicks = plan.comidas.length + plan.snacks.length + HABITOS.length +
                       (sesionDe(d) === 'descanso' ? 0 : 1);
    const hechos = Object.keys(dd.ticks || {}).length;
    const pct = totalTicks ? Math.min(1, hechos/totalTicks) : 0;
    const t = targets(dd.peso ? +dd.peso : pesoVigente(), ent);
    const tot = totales({...dd, fecha:f});
    const R = 14, C = 2*Math.PI*R;
    // Lo que el día TRAE PLANEADO: es lo único informativo en un día futuro.
    const planKcal = [...plan.comidas, ...plan.snacks]
      .reduce((a, id) => a + (D.recetas[id]?.kcal || 0), 0);
    const ses = sesionDe(d);
    const sesTxt = ses === 'descanso' ? 'descanso' : ses === 'cardio' ? 'caminadora'
      : (D.entrenos[ses]?.n || ses).replace(/ - .*$/, '');

    const cuerpo = futuro
      ? `<div class="wplan">
           <span><b>${Math.round(planKcal)}</b> kcal en plan</span><br>
           <span>${esc(sesTxt)}</span><br>
           <span>${plan.comidas.length + plan.snacks.length} comidas</span>
         </div>`
      : `<div class="ring">
          <svg viewBox="0 0 34 34" aria-hidden="true">
            <circle cx="17" cy="17" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="4"/>
            <circle cx="17" cy="17" r="${R}" fill="none" stroke="var(--accent)" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}"
              stroke-dashoffset="${(C*(1-pct)).toFixed(1)}"/>
          </svg>
          <span class="rt">${hechos}/${totalTicks}<br>hechos</span>
        </div>
        <div class="wstat">
          <span>${tot.kcal ? `<b>${Math.round(tot.kcal)}</b>/${t.kcal}` : `<span class="miss">— kcal</span>`}</span>
          <span>${tot.p ? `<b>${Math.round(tot.p)}</b> g prot` : `<span class="miss">— prot</span>`}</span>
          <span>${dd.peso ? `<b>${(+dd.peso).toFixed(1)}</b> kg` : `<span class="miss">sin peso</span>`}</span>
          <span>${dd.whoop?.recovery != null ? `<b>${Math.round(dd.whoop.recovery)}%</b> rec` : `<span class="miss">sin whoop</span>`}</span>
        </div>`;

    return `<div class="wday ${esHoy?'today':''} ${futuro?'future':''} ${f===VIENDO?'viendo':''}"
        data-dia="${f}" role="button" tabindex="0"
        aria-label="Ver ${DIAS[d.getDay()]} ${d.getDate()}">
      <div class="wd-h"><span class="dn2">${DIAS_C[d.getDay()]}${esHoy?' · hoy':''}</span>
        <span class="dd">${String(d.getDate()).padStart(2,'0')}</span></div>
      <span class="wd-t">${ent?'entreno':'descanso'}</span>
      ${cuerpo}
    </div>`;
  }).join('');

  // Agregados: solo días ya transcurridos. Contra 7 en una semana futura
  // el porcentaje diría "0/7" y parecería un fracaso en vez de un futuro.
  const pasadas = fechas.filter(f => !esFuturo(f));
  const conAlgo = pasadas.map(f => semana[f]).filter(x => x && Object.keys(x.ticks||{}).length);
  const pesados = pasadas.map(f => semana[f]).filter(x => x?.peso);
  const entrenados = pasadas.filter(f => (semana[f]?.ticks||{}).gym).length;
  const nDias = pasadas.length;
  // Semana entera por venir: "0/7" leería como un fracaso en vez de un futuro.
  const porVenir = nDias === 0;
  let kcalProm = 0, protProm = 0;
  if (conAlgo.length){
    const sum = conAlgo.reduce((a,dd) => {
      const t = totales(dd); a.k += t.kcal; a.p += t.p; return a;
    }, {k:0,p:0});
    kcalProm = Math.round(sum.k/conAlgo.length);
    protProm = Math.round(sum.p/conAlgo.length);
  }
  const cel = (v,l) => `<div class="sumcell"><div class="v2">${v}</div><div class="l2">${l}</div></div>`;
  const planSemana = fechas.reduce((a, f) => a + [...planDe(desdeIso(f)).comidas,
    ...planDe(desdeIso(f)).snacks].reduce((b, id) => b + (D.recetas[id]?.kcal || 0), 0), 0);
  $('weekSum').innerHTML = porVenir
    ? cel('7', 'días planeados') +
      cel(fechas.filter(f => esEntreno(desdeIso(f))).length, 'días de entreno') +
      cel(Math.round(planSemana/7), 'kcal/día en plan') +
      cel('—', 'aún sin registrar')
    : cel(`${conAlgo.length}/${nDias}`, 'días con registro') +
      cel(`${pesados.length}/${nDias}`, 'días pesados') +
      cel(entrenados, 'entrenos marcados') +
      cel(kcalProm || '—', 'kcal promedio') +
      cel(protProm ? protProm+' g' : '—', 'proteína promedio');
  $('weekTag').textContent = pasadas.length === 0 ? 'semana por venir'
    : conAlgo.length ? `${conAlgo.length} con datos` : 'sin datos aún';

  renderSpark();
  $('flags').innerHTML = D.banderas.map(b => `<div class="item">
    <span class="verdict ${b.est.startsWith('ALTO')?'v-bad':b.est.startsWith('BAJO')?'v-warn':'v-warn'}"
      style="margin-top:2px">${b.est.startsWith('ALTO')?'alto':'bajo'}</span>
    <div class="itxt"><div class="t">${esc(b.m)} — ${b.prev} → ${b.act} ${esc(b.u)}</div>
      <div class="s" style="font-family:var(--f-ui);font-size:12.5px;color:var(--ink-soft)">${esc(b.acc)}</div></div>
    <span class="es mono" style="color:var(--ink-faint);font-size:11px">ref ${esc(b.ref)}</span>
  </div>`).join('');
}

function renderSpark(){
  const pts = Object.keys(semana).filter(f => semana[f]?.peso).sort()
    .map(f => ({f, v:+semana[f].peso}));
  if (pts.length < 2){
    $('spark').innerHTML = `<p class="note">Con dos pesos ya te dibujo la tendencia. Registra el de hoy arriba.</p>`;
    $('sparkTag').textContent = `${pts.length} dato${pts.length===1?'':'s'}`;
    return;
  }
  // Media móvil de 7 días: el peso diario es ruido, esta es la señal.
  const media = pts.map((_,i) => {
    const v = pts.slice(Math.max(0,i-6), i+1);
    return {f: pts[i].f, v: v.reduce((a,x)=>a+x.v,0)/v.length};
  });
  const W = 100, H = 96, pad = 4;
  const vals = media.map(m => m.v).concat(pts.map(p => p.v));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1){ const c = (hi+lo)/2; lo = c-0.5; hi = c+0.5; }
  const x = i => pad + i*(W-2*pad)/Math.max(1, media.length-1);
  const y = v => H-14 - (v-lo)/(hi-lo)*(H-28);
  const linea = media.map((m,i) => `${x(i).toFixed(2)},${y(m.v).toFixed(2)}`).join(' ');
  const area = `${x(0).toFixed(2)},${(H-14).toFixed(2)} ${linea} ${x(media.length-1).toFixed(2)},${(H-14).toFixed(2)}`;
  const ult = media[media.length-1], prim = media[0];
  const dl = ult.v - prim.v;
  $('spark').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
      aria-label="Media móvil del peso: ${prim.v.toFixed(1)} a ${ult.v.toFixed(1)} kg">
    <polygon points="${area}" fill="var(--accent-wash)"/>
    <polyline points="${linea}" fill="none" stroke="var(--accent)" stroke-width="1.2"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    ${pts.map((p,i) => `<circle cx="${x(Math.min(i,media.length-1)).toFixed(2)}" cy="${y(p.v).toFixed(2)}"
      r="1.4" fill="var(--ink-faint)" vector-effect="non-scaling-stroke"/>`).join('')}
    <circle cx="${x(media.length-1).toFixed(2)}" cy="${y(ult.v).toFixed(2)}" r="2.4"
      fill="var(--accent)" vector-effect="non-scaling-stroke"/>
  </svg>
  <p class="note" style="margin-top:8px">
    Media: <span class="mono">${prim.v.toFixed(1)}</span> → <span class="mono">${ult.v.toFixed(1)} kg</span>
    (<span class="mono">${dl>0?'+':''}${dl.toFixed(1)}</span>) ·
    meta <span class="mono">${D.perfil.peso_meta_kg} kg</span>.
    Los puntos grises son los pesos diarios; la línea es la media de 7 días, que es la que hay que leer.</p>`;
  $('sparkTag').textContent = `${pts.length} pesos`;
}

function renderNav(){
  const fut = esFuturo(VIENDO), n = $('dayNote');
  $('navToday').setAttribute('aria-current', String(VIENDO === HOY));
  // El plan se genera para cualquier fecha, así que no hay tope de navegación.
  $('navNext').disabled = false;
  $('navPrev').disabled = false;

  // Todo lo que escribe se apaga en un día que aún no ha llegado.
  const apagar = ['inWeight','btnWeight','inRec','inSleep','inStrain','btnWhoopSave',
                  'btnWhoopManual','inExtra'];
  apagar.forEach(id => { const el = $(id); if (el) el.disabled = fut; });
  $('btnExtra').disabled = fut || !SAMPLE;
  $('whoopFileWrap').style.pointerEvents = fut ? 'none' : '';
  $('whoopFileWrap').style.opacity = fut ? '.45' : '';

  if (VIENDO === HOY){ n.hidden = true; return; }
  const d = desdeIso(VIENDO);
  const dif = Math.round((d - desdeIso(HOY)) / 864e5);
  n.hidden = false;
  n.innerHTML = fut
    ? `<b>Estás viendo ${DIAS[d.getDay()]}, en ${dif} día${dif===1?'':'s'}.</b>
       <span>Es para preparar: el plan y el entreno son los definitivos, pero no se
       puede marcar nada hasta que llegue el día.</span>`
    : `<b>Estás viendo ${DIAS[d.getDay()]} ${d.getDate()}, hace ${-dif} día${dif===-1?'':'s'}.</b>
       <span>Puedes marcar lo que se te olvidó y registrar el peso de ese día.</span>`;
}

function render(){
  renderNav(); renderHead(); renderMacros(); renderComidas(); renderGym();
  renderHabitos(); renderWhoop(); renderExtras();
  if (!$('vSem').hidden) renderSemana();
}

function irA(f){
  VIENDO = f;
  ANCLA = f;
  dia = semana[VIENDO] ? {...semana[VIENDO]} : {fecha: VIENDO};
  abiertos.clear();
  render();
}

/* ── Eventos ──────────────────────────────────────────────────────── */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tick],[data-receta],[data-gym],[data-delextra]');
  if (!t) return;
  if (t.dataset.tick) return toggle(t.dataset.tick);
  if (t.dataset.receta){
    const id = t.dataset.receta;
    abiertos.has(id) ? abiertos.delete(id) : abiertos.add(id);
    return renderComidas();
  }
  if (t.dataset.gym){
    abiertos.has('gym') ? abiertos.delete('gym') : abiertos.add('gym');
    return renderGym();
  }
  if (t.dataset.delextra){
    const ex = [...(dia.extras||[])];
    ex.splice(+t.dataset.delextra, 1);
    return guardar({extras: ex});
  }
});

$('navPrev').onclick = () => irA(masDias(VIENDO, -1));
$('navNext').onclick = () => irA(masDias(VIENDO,  1));
$('navToday').onclick = () => irA(HOY);
$('wkPrev').onclick = () => { ANCLA = masDias(lunesDe(ANCLA), -7); renderSemana(); };
$('wkNext').onclick = () => { ANCLA = masDias(lunesDe(ANCLA),  7); renderSemana(); };
$('wkNow').onclick  = () => { ANCLA = HOY; renderSemana(); };

// Una columna de la semana salta a ese día
document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-dia]');
  if (!c) return;
  irA(c.dataset.dia);
  vista(true);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const c = ev.target.closest?.('[data-dia]');
  if (!c) return;
  ev.preventDefault();
  irA(c.dataset.dia);
  vista(true);
});
// Flechas del teclado para moverse de día
document.addEventListener('keydown', ev => {
  if (ev.target.matches('input, textarea') || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === 'ArrowLeft')  irA(masDias(VIENDO, -1));
  if (ev.key === 'ArrowRight') irA(masDias(VIENDO,  1));
});

$('tabHoy').onclick = () => vista(true);
$('tabSem').onclick = () => vista(false);
function vista(hoy){
  $('vHoy').hidden = !hoy; $('vSem').hidden = hoy;
  $('tabHoy').setAttribute('aria-selected', String(hoy));
  $('tabSem').setAttribute('aria-selected', String(!hoy));
  if (!hoy) renderSemana();
}

$('btnWeight').onclick = () => {
  const v = parseFloat($('inWeight').value);
  if (!(v > 40 && v < 250)) return;
  guardar({peso: v});
  $('inWeight').value = '';
};
$('inWeight').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnWeight').click(); });

$('btnWhoopManual').onclick = () => {
  const m = $('whoopManual');
  m.hidden = !m.hidden;
  if (!m.hidden) $('inRec').focus();
};
$('btnWhoopSave').onclick = () => {
  const w = {};
  const r = parseFloat($('inRec').value), s = parseFloat($('inSleep').value), st = parseFloat($('inStrain').value);
  if (r >= 0) w.recovery = r;
  if (s >= 0) w.sueno = s;
  if (st >= 0) w.strain = st;
  if (!Object.keys(w).length) return;
  guardar({whoop: {...(dia.whoop||{}), ...w}});
  $('whoopManual').hidden = true;
  ['inRec','inSleep','inStrain'].forEach(id => $(id).value = '');
};

/* Captura del WHOOP: Claude la lee, se guardan los números, no la imagen. */
$('whoopFile').onchange = async ev => {
  const file = ev.target.files?.[0];
  ev.target.value = '';
  if (!file || !SAMPLE) return;
  const hint = $('whoopHint');
  hint.textContent = 'Leyendo la captura…';
  try {
    const r = await SAMPLE.json(
      'Esta es una captura de la app WHOOP. Devuelve SOLO este JSON, sin markdown:\n' +
      '{"recovery":<0-100 o null>,"sueno":<horas dormidas como decimal, o null>,"strain":<0-21 o null>}\n' +
      'recovery es el porcentaje de Recovery. sueno son las horas de sueño (si ves "7:12" son 7.2). ' +
      'strain es el Day Strain. Si un valor no aparece en la imagen, pon null. No inventes números.',
      {images: file, modelTier: 'quick', cache: false});
    const w = {};
    if (r && r.recovery != null && isFinite(r.recovery)) w.recovery = Math.max(0, Math.min(100, +r.recovery));
    if (r && r.sueno != null && isFinite(r.sueno)) w.sueno = Math.max(0, Math.min(16, +r.sueno));
    if (r && r.strain != null && isFinite(r.strain)) w.strain = Math.max(0, Math.min(21, +r.strain));
    if (!Object.keys(w).length){
      hint.textContent = 'No encontré números en esa captura. Métela a mano con el botón de al lado.';
      return;
    }
    guardar({whoop: {...(dia.whoop||{}), ...w}});
    hint.textContent = 'Leído. Revisa los números: si alguno quedó mal, corrígelo a mano.';
  } catch (e) {
    hint.textContent = e.code === 'not_granted'
      ? 'No diste permiso para usar Claude. Métele los números a mano.'
      : e.code === 'rate_limited' ? 'Demasiadas peticiones seguidas. Espera un momento o métela a mano.'
      : e.code === 'images_unavailable' ? 'Tu cuenta no puede mandar imágenes aquí. Usa el botón "A mano".'
      : 'No pude leer la captura (' + (e.code||'error') + '). Métela a mano.';
  }
};

/* Comida fuera del plan: Claude estima los macros, el veredicto lo calculo yo. */
$('btnExtra').onclick = async () => {
  const desc = $('inExtra').value.trim();
  if (!desc) return;
  const out = $('extraOut');
  if (!SAMPLE){
    out.innerHTML = `<div class="err">Claude no está disponible en esta vista, así que no puedo estimar los macros. Anótalo en el bot con <span class="mono">comi ${esc(desc)}</span>.</div>`;
    return;
  }
  $('btnExtra').disabled = true;
  out.innerHTML = `<div class="thinking">Estimando macros…</div>`;
  try {
    const r = await SAMPLE.json(
      'Eres nutricionista y estimas los macros de una comida descrita en español (Australia). ' +
      'Devuelve SOLO este JSON, sin markdown:\n' +
      '{"nombre":"","kcal":0,"p":0,"c":0,"f":0,"fib":0}\n' +
      'p/c/f/fib son gramos de proteína, carbohidratos, grasa y fibra de la porción COMPLETA descrita. ' +
      'Si no se da cantidad, asume una porción normal de adulto. Sé realista: la gente subestima el aceite, ' +
      'las salsas y el tamaño de las porciones de restaurante.\n\nComida: ' + desc,
      {modelTier: 'quick', cache: false});
    const e = {
      desc: String(r?.nombre || desc).slice(0,90),
      kcal: +r?.kcal||0, p: +r?.p||0, c: +r?.c||0, f: +r?.f||0, fib: +r?.fib||0,
    };
    // El veredicto sale de aritmética, no del modelo: siempre consistente.
    const t = targets(pesoVigente(), esEntreno(desdeIso(VIENDO)));
    const antes = totales(dia), despues = antes.kcal + e.kcal;
    const sobra = despues - t.kcal;
    if (sobra <= 0) e.aviso = `Cabe. Te quedan ${Math.round(-sobra)} kcal y ${Math.max(0, Math.round(t.p - antes.p - e.p))} g de proteína para cerrar el día.`;
    else if (sobra <= 250) e.aviso = `Te pasa ${Math.round(sobra)} kcal del día — eso es ruido, no un problema: el déficit se cuenta por semana. Si quieres compensar, cambia la cena por el revuelto de espinaca y cottage (503 kcal, 58 g de proteína).`;
    else if (sobra <= 600) e.aviso = `Te pasa ${Math.round(sobra)} kcal. Un día no rompe nada, pero no lo repitas mañana: dos así seguidos ya te borran el déficit de la semana. Camina 30 min extra y sostén la proteína.`;
    else e.aviso = `Te pasa ${Math.round(sobra)} kcal, que es un día entero de déficit. Sigue registrando y mañana vuelve al plan sin compensar de más: recortar mucho al día siguiente es lo que dispara el siguiente atracón.`;
    if (e.p >= 25) e.aviso += ` A favor: trae ${Math.round(e.p)} g de proteína.`;
    guardar({extras: [...(dia.extras||[]), e]});
    $('inExtra').value = '';
    out.innerHTML = '';
  } catch (err) {
    out.innerHTML = `<div class="err">${err.code === 'not_granted'
      ? 'No diste permiso para usar Claude en esta página.'
      : err.code === 'rate_limited' ? 'Demasiadas peticiones seguidas, espera un momento.'
      : 'No pude estimarlo (' + esc(err.code||'error') + '). Intenta describirlo más simple.'}</div>`;
  } finally {
    $('btnExtra').disabled = false;
  }
};
$('inExtra').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnExtra').click(); });

/* ── Arranque ─────────────────────────────────────────────────────── */
render();     // La página sirve sin nada conectado: ya dice qué hacer hoy.

(async () => {
  const use = n => (typeof claude === 'undefined' || !claude?.use)
    ? Promise.resolve(null) : claude.use(n).catch(() => null);
  SAMPLE = await use('sample');
  if (!SAMPLE){
    $('whoopFileWrap').hidden = true;
    $('whoopManual').hidden = false;
    $('whoopHint').textContent = 'Métele los números a mano: leer la captura necesita Claude, que no está disponible aquí.';
    $('btnExtra').textContent = 'No disponible';
    $('btnExtra').disabled = true;
  } else {
    const lim = await SAMPLE.limits().catch(() => null);
    PUEDE_IMG = !!lim?.images;
    if (!PUEDE_IMG){
      $('whoopFileWrap').hidden = true;
      $('whoopManual').hidden = false;
      $('whoopHint').textContent = 'Tu cuenta no puede mandar imágenes aquí, así que los números del WHOOP van a mano.';
    } else {
      $('whoopFile').accept = lim.images.mediaTypes?.join(',') || 'image/*';
    }
  }
})();

(async () => {
  const use = n => (typeof claude === 'undefined' || !claude?.use)
    ? Promise.resolve(null) : claude.use(n).catch(() => null);
  DB = await use('db');
  if (!DB){
    mostrarOffline('No hay almacén disponible en esta vista, así que lo que marques no se va a guardar. El plan de hoy y las recetas sí funcionan.');
    return;
  }
  // Suscripción a los últimos 21 días: el rango que necesita la media móvil.
  // 21 días atrás cubren la media móvil; el rango no se corta arriba para que
  // un día futuro ya registrado (por ejemplo un peso adelantado) también entre.
  const desde = iso(new Date(Date.now() - 20*864e5));
  DB.collection('dias').where('fecha', '>=', desde).orderBy('fecha', 'asc').limit(60)
    .onSnapshot(snap => {
      const nuevo = {};
      snap.docs.forEach(d => { const v = d.data(); if (v) nuevo[d.id] = v; });
      semana = nuevo;
      dia = semana[VIENDO] ? {...semana[VIENDO]} : {fecha: VIENDO};
      mostrarOffline('');
      render();
    }, e => {
      mostrarOffline(e.code === 'revoked'
        ? 'Se retiró el acceso al almacén mientras la página estaba abierta. Recárgala.'
        : 'Se cortó la conexión con el almacén (' + (e.code||'error') + '). Recarga la página para volver a sincronizar.');
    });
})();

// Si la pestaña queda abierta y cambia el día, la página se pone al día sola.
setInterval(() => {
  const f = iso(new Date());
  if (f !== HOY){
    const seguiaEnHoy = VIENDO === HOY;
    HOY = f;
    // Si estaba mirando "hoy", lo mueve al nuevo hoy; si estaba navegando,
    // lo deja donde estaba y solo recalcula qué cuenta como futuro.
    if (seguiaEnHoy) irA(HOY); else render();
  }
}, 60000);
</script>
